:root{

  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0C1A; --surface:#1D1934; --sunk:#252040; --hover:#2E2852; --ink:#F3F1F8; --muted:#ABA6C2; --line:#3A3360;
    --pine:var(--brand2); --pine-ink:var(--brand); --pine-soft:color-mix(in srgb, var(--brand2) 16%, #1D1934);
    --mustard:var(--brand2); --mustard-soft:color-mix(in srgb, var(--brand2) 16%, #1D1934); --focus:var(--brand2); --danger:#FF8A75; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0C1A; --surface:#1D1934; --sunk:#252040; --hover:#2E2852; --ink:#F3F1F8; --muted:#ABA6C2; --line:#3A3360;
  --pine:var(--brand2); --pine-ink:var(--brand); --pine-soft:color-mix(in srgb, var(--brand2) 16%, #1D1934);
  --mustard:var(--brand2); --mustard-soft:color-mix(in srgb, var(--brand2) 16%, #1D1934); --focus:var(--brand2); --danger:#FF8A75; color-scheme:dark;
}

.pf-card .pf-top{padding-top:0}
.pf-card .pf-head{margin-top:-56px}
.pf-card .pf-back{position:absolute;top:12px;left:14px;background:rgba(255,255,255,.92);color:#1D1934;border-radius:999px;padding:6px 14px;margin:0}
.pf-card{position:relative}
.pf-head .pf-info{padding-top:68px}
.pf-cover.ces{background-size:120% auto;background-position:50% 45%}
.marca{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:6px}
.marca.uni{background:#FFD400;color:#1D1934}
.marca.ces{background:#0E3A66;color:#fff}
a.autolink{color:var(--pine);font-weight:600;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.vload{padding:50px 16px;text-align:center;color:#ddd;font-size:14px}
.vload button{margin-top:8px}
@media (max-width:600px){.pf-cover{height:110px}.pf-card .pf-head{margin-top:-42px}.pf-head .pf-info{padding-top:52px}}
img,video{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--topbar);background:var(--brand);color:#fff;border-bottom:3px solid var(--brand2);display:flex;align-items:center;gap:12px;padding:0 16px}
.topbar :focus-visible{outline-color:var(--brand2)}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;margin:0;color:#fff}
.topbar .grow{flex:1}
.search{flex:0 1 300px;display:flex;align-items:center;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:0 14px;height:40px}
.search input{border:0;background:transparent;width:100%;outline:none;color:#fff}
.search input::placeholder{color:rgba(255,255,255,.65)}
.me-chip{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 10px 4px 4px;border-radius:999px;font-weight:600}
.me-chip{color:#fff}
.me-chip:hover{background:rgba(255,255,255,.12)}
.top-admin{background:var(--brand2);color:var(--brand);border:0;border-radius:999px;padding:8px 14px;font-weight:700;display:flex;gap:6px;align-items:center}
.top-admin:hover{filter:brightness(1.06)}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,600px) 280px;gap:28px;justify-content:center;padding:20px 16px 80px}
.side{position:sticky;top:calc(var(--topbar) + env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:10px;font-weight:600}
.nav-item:hover{background:var(--hover)}
.nav-item[aria-current="true"]{background:var(--pine-soft);color:var(--pine)}
.nav-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:17px;flex:none;border:1px solid var(--line)}
.nav-sep{height:1px;background:var(--line);margin:8px 12px}
.panel{background:var(--surface);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.panel h2{margin:0 0 8px;font-size:16px}
.panel p{margin:0;color:var(--muted);font-size:15px}
.rank{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.rank button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px;border-radius:10px;text-align:left;width:100%;min-width:0}
.rank button:hover{background:var(--hover)}
.rank .cnt{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank .nm{font-weight:600;font-size:15px;line-height:1.2}
.rank .em{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--pine);font-weight:600}
.linkbtn:hover{text-decoration:underline}
.edit-area{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.edit-area .lbl{font-size:13px;font-weight:700}
.colors{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.colors input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}

/* feed */
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:74px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}

.btn{border:0;border-radius:10px;padding:8px 18px;font-weight:700;background:var(--pine);color:var(--pine-ink)}

.preview{margin-top:10px;position:relative;border-radius:12px;overflow:hidden;background:var(--sunk)}

.picker{position:absolute;bottom:calc(100% - 2px);left:0;display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:6}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}

<script>
(() => {
// null/false children are skipped everywhere (avoids stray "null" text)
for (const fn of ["replaceChildren","append"]){
  const orig = Element.prototype[fn];
  Element.prototype[fn] = function(...a){ return orig.apply(this, a.filter(x => x != null && x !== false)); };
}
const DEFAULT_COLORS = {primary:"#1D1934", accent:"#FFC629"};
const REACTIONS = [
  {k:"like", e:"👍", label:"Curtir"}, {k:"love", e:"❤️", label:"Amei"}, {k:"clap", e:"👏", label:"Aplausos"},
  {k:"party", e:"🎉", label:"Parabéns"}, {k:"haha", e:"😂", label:"Haha"}
];
const RX = Object.fromEntries(REACTIONS.map(r => [r.k, r]));
const SETORES = ["CSC - Matrícula","CSC - Financeiro","CSC - Reclame Aqui","CSC - Backoffice","CSC - Chat Uniasselvi","CSC - Chat Unicesumar"];
const CARGOS = ["Assistente de CSC","Analista de CSC","Supervisor","Coordenador","Gerente"];
function cargoSelect(val, label){
  const sel = h("select",{class:"field", "aria-label":label || "Cargo"}, h("option",{value:"", text:"Selecione o cargo"}), CARGOS.map(x => h("option",{value:x, text:x})));
  if (val && !CARGOS.includes(val)) sel.append(h("option",{value:val, text:val + " (antigo)"}));
  sel.value = val || ""; return sel;
}
const MARCAS = ["Uniasselvi","Unicesumar"];
const VIDEO_DB_MAX = 15*1024*1024, VIDEO_ASSET_MAX = 20*1024*1024;
function marcaSelect(val, id){
  const sel = h("select",{class:"field", id:id || null, "aria-label":"Marca"}, h("option",{value:"", text:"Selecione a marca"}), MARCAS.map(x => h("option",{value:x, text:x})));
  sel.value = val || ""; return sel;
}
const URL_RE = /((?:https?:\/\/|www\.)[^\s<>"']+[^\s<>"'.,;:!?)\]])/gi;
function linkify(text){
  const out = []; let last = 0; text = text || "";
  text.replace(URL_RE, (m, _g, idx) => {
    if (idx > last) out.push(document.createTextNode(text.slice(last, idx)));
    const href = /^https?:/i.test(m) ? m : "https://" + m;
    out.push(h("a",{class:"autolink", href, target:"_blank", rel:"noopener noreferrer", onclick:e => openLink(e, href), text:m}));
    last = idx + m.length; return m;
  });
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function openLink(e, url){
  e.preventDefault(); e.stopPropagation();
  let w = null;
  try { w = window.open(url, "_blank"); } catch(err){}
  if (w){ try { w.opener = null; } catch(err){} return; }
  const inp = h("input",{class:"field", value:url, readonly:true, "aria-label":"Endereço do link"});
  openModal([h("h2",{text:"Abrir link", style:"font-size:24px"}),
    h("p",{class:"muted", text:"O navegador bloqueou a abertura automática. Use um dos botões abaixo."}), inp,
    h("div",{style:"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"},
      h("a",{class:"btn", href:url, target:"_top", rel:"noopener noreferrer", style:"text-decoration:none", text:"Abrir nesta aba"}),
      h("button",{class:"btn ghost", onclick: async () => {
        try { await navigator.clipboard.writeText(url); toast("Link copiado."); }
        catch(err){ inp.select(); try { document.execCommand("copy"); toast("Link copiado."); } catch(e2){ toast("Selecione o endereço e copie manualmente."); } }
      }, text:"Copiar link"}))], "Abrir link");
}
const ROLES = [["membro","Membro"],["moderador","Moderador"],["gestao","Gestão"]];
const $ = id => document.getElementById(id);
const S = {
  db:null, user:null, assets:null, meId:null, isAdmin:false, isOwner:false, canWrite:true, loggedIn:false,
  posts:[], comments:new Map(), reactions:new Map(), votes:new Map(), acks:new Map(), media:new Map(), avatars:new Map(),
  members:new Map(), approvals:new Map(), invites:new Map(), profiles:{}, pending:new Set(), cards:new Map(), expanded:new Set(),
  ready:{config:false, members:false, approvals:false, posts:false, acks:false},
  domains:[], file:null, fileKind:null, filter:"all", author:null, q:"", mode:"post", lockId:null,
  view:"feed", profileId:null, pfSort:"desc", pfLayout:"grid", setor:null, detailId:null, detailCard:null, pcards:new Map()
};

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "value") el.value = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c);
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const safeSeg = s => String(s).replace(/[^A-Za-z0-9_\-~:@+]/g, "-");
const norm = e => (e || "").trim().toLowerCase();
const rtf = new Intl.RelativeTimeFormat("pt-BR", {numeric:"auto"});
const dtf = new Intl.DateTimeFormat("pt-BR", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
function when(ms){
  const d = (Date.now() - ms)/1000;
  if (d < 45) return "agora";
  if (d < 3600) return rtf.format(-Math.round(d/60), "minute");
  if (d < 86400) return rtf.format(-Math.round(d/3600), "hour");
  if (d < 86400*6) return rtf.format(-Math.round(d/86400), "day");
  return dtf.format(ms);
}
function until(ms){
  const d = (ms - Date.now())/1000;
  if (d < 3600) return rtf.format(Math.max(1, Math.round(d/60)), "minute");
  if (d < 86400) return rtf.format(Math.round(d/3600), "hour");
  return rtf.format(Math.round(d/86400), "day");
}
const plural = (n, s, p) => n + " " + (n === 1 ? s : p);
const typeOf = p => p.type || "post";

/* ---------- people ---------- */
function prof(id){
  const p = S.profiles[id], m = S.members.get(id), a = apr(id);
  return {
    name: (m && m.displayName) || (p && p.name) || (id && id === S.meId ? "Você" : "Colega"),
    avatar: S.avatars.get(id) || (p && p.avatarUrl) || null,
    email: (a && a.email) || (m && m.email) || "", setor: (m && m.setor) || "", cargo: (a && a.cargo) || "", bio: (m && m.bio) || "", marca: (m && m.marca) || ""
  };
}
const firstName = id => prof(id).name.split(" ")[0];
function avatarEl(id, cls){
  const p = prof(id), c = "avatar" + (cls ? " " + cls : "");
  if (p.avatar) return h("img",{class:c, src:p.avatar, alt:""});
  const ini = (p.name || "?").split(" ").filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();
  return h("span",{class:c + " ini", "aria-hidden":"true", text: id ? ini : ""});
}
async function resolveProfiles(ids){
  if (!S.user) return;
  const need = [...new Set(ids)].filter(i => i && !S.profiles[i] && !S.pending.has(i));
  if (!need.length) return;
  need.forEach(i => S.pending.add(i));
  try { Object.assign(S.profiles, await S.user.profiles(need)); } catch(e) {}
  need.forEach(i => S.pending.delete(i));
  renderAll();
}
function apr(id){
  const a = S.approvals.get(id); if (a) return a;
  const m = S.members.get(id); const inv = m && S.invites.get(norm(m.email));
  return inv ? {userId:id, status:"aprovado", role:inv.role || "membro", cargo:inv.cargo || "", email:norm(m.email), viaInvite:true} : undefined;
}
const roleOf = id => (apr(id) || {}).role || "membro";
const LEADER_CARGOS = ["Gerente","Coordenador","Supervisor"];
const isLeader = id => { const a = apr(id); return !!a && a.status === "aprovado" && LEADER_CARGOS.includes(a.cargo); };
const isOwnerRow = a => !!a && a.role === "administrador";
const canAdmin = () => S.isOwner || isLeader(S.meId);
const isDenied = e => !!e && ["invalid_argument","not_granted","permission-denied","PERMISSION_DENIED"].includes(e.code);
const canManage = () => canAdmin() || isLeader(S.meId);
const canModerate = () => canManage();
const approvedIds = () => [...S.members.keys()].filter(id => (apr(id) || {}).status === "aprovado");
const cargoOf = id => (apr(id) || {}).cargo || "";

function setStatus(msg, err){ const s=$("status"); s.textContent = msg||""; s.className = "status" + (err?" err":""); }

  S.canWrite = false;
  $("composer").hidden = true; $("tabNew").hidden = true;
  $("notice").replaceChildren(h("div",{class:"notice",text:"Você não tem permissão para esta ação. Se acha que é um engano, fale com a liderança."}));
  $("gate").hidden = true; $("lock").hidden = true;
  renderAll();
}
function applyColors(c){
  const ok = v => /^#[0-9a-f]{6}$/i.test(v || "");
  const root = document.documentElement.style;
  root.setProperty("--brand", ok(c.primary) ? c.primary : DEFAULT_COLORS.primary);

/* ---------- boot (Supabase) ---------- */
let sb = null, authUser = null, fullStarted = false, ownStarted = false;
function showSetup(msg){
  $("gate").hidden = false;
  $("gateCard").replaceChildren(h("div",{class:"gate-logo","aria-hidden":"true"}),
    h("h2",{text:"Configuração pendente"}),
    h("p",{text: msg || "Este Purple ainda não foi ligado a um projeto do Supabase. Abra o arquivo index.html, procure o bloco CONFIGURAÇÃO DO PURPLE e cole a Project URL e a chave pública do seu projeto."}));
}
function makeDb(sb){
  const store = new Map(), loadedColl = new Map(), subs = new Set();
  let tick = null;
  const notify = () => { if (tick) return; tick = setTimeout(() => { tick = null; subs.forEach(f => { try { f(); } catch(e){ console.error(e); } }); }, 25); };
  const isBlob = p => p.startsWith("media/") || p.startsWith("vchunks/");
  const tbl = p => isBlob(p) ? "blobs" : "docs";
  const split = p => { const i = p.lastIndexOf("/"); return {coll:p.slice(0,i), id:p.slice(i+1)}; };
  const mapErr = e => { const x = new Error((e && e.message) || "erro"); x.code = (e && (e.code === "42501" || /row-level security|permission/i.test(e.message || ""))) ? "permission-denied" : ((e && e.code) || "unknown"); return x; };
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const strip = d => JSON.parse(JSON.stringify(d));
  const snapDoc = path => { const v = store.get(path); return {id:split(path).id, exists:v !== undefined, data:() => clone(v)}; };
  async function fetchDoc(path){
    const {data, error} = await sb.from(tbl(path)).select("data").eq("path", path).maybeSingle();
    if (error) throw mapErr(error);
    if (data) store.set(path, data.data); else store.delete(path);
  }
  async function fetchColl(coll){
    const t = tbl(coll + "/x"); let rows = [], from = 0;
    for (;;){
      const {data, error} = await sb.from(t).select("path,data").eq("coll", coll).range(from, from + 999);
      if (error) throw mapErr(error);
      rows = rows.concat(data); if (data.length < 1000) break; from += 1000;
    }
    for (const k of [...store.keys()]) if (split(k).coll === coll) store.delete(k);
    rows.forEach(r => store.set(r.path, r.data));
  }
  function ensureColl(coll){
    if (!loadedColl.has(coll)){ const pr = fetchColl(coll); loadedColl.set(coll, pr); pr.catch(() => loadedColl.delete(coll)); }
    return loadedColl.get(coll);
  }
  function docRef(path){
    return {
      id:split(path).id, path,
      async get(){ await fetchDoc(path); return snapDoc(path); },
      async set(d){
        const {coll, id} = split(path), data = strip(d);
        const {error} = await sb.from(tbl(path)).upsert({path, coll, doc_id:id, data});
        if (error) throw mapErr(error);
        store.set(path, data); notify();
      },
      async update(patch){
        await fetchDoc(path);
        if (!store.has(path)){ const e = new Error("not found"); e.code = "not-found"; throw e; }
        const data = {...store.get(path), ...strip(patch)};
        const {error} = await sb.from(tbl(path)).update({data}).eq("path", path);
        if (error) throw mapErr(error);
        store.set(path, data); notify();
      },
      async delete(){
        const {error} = await sb.from(tbl(path)).delete().eq("path", path);
        if (error) throw mapErr(error);
        store.delete(path); notify();
      },
      onSnapshot(fn, onErr){
        let ok = false;
        fetchDoc(path).then(() => { ok = true; fn(snapDoc(path)); }).catch(e => onErr && onErr(e));
        const f = () => { if (ok) fn(snapDoc(path)); }; subs.add(f); return () => subs.delete(f);
      }
    };
  }
  function query(coll, o = {}){
    const run = () => {
      let docs = [...store.entries()].filter(([k]) => split(k).coll === coll).map(([k,v]) => ({id:split(k).id, d:v}));
      if (o.order){ const [f, dir] = o.order; docs.sort((a,b) => ((a.d[f] > b.d[f]) ? 1 : (a.d[f] < b.d[f]) ? -1 : 0) * (dir === "desc" ? -1 : 1)); }
      if (o.limit) docs = docs.slice(0, o.limit);
      return {docs: docs.map(x => ({id:x.id, exists:true, data:() => clone(x.d)}))};
    };
    return {
      orderBy:(f, dir) => query(coll, {...o, order:[f, dir || "asc"]}),
      limit:n => query(coll, {...o, limit:n}),
      doc:id => docRef(coll + "/" + id),
      async get(){ await fetchColl(coll); return run(); },
      onSnapshot(fn, onErr){
        let ok = false;
        ensureColl(coll).then(() => { ok = true; fn(run()); }).catch(e => onErr && onErr(e));
        const f = () => { if (ok) fn(run()); }; subs.add(f); return () => subs.delete(f);
      }
    };
  }
  sb.channel("purple-docs").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, pl => {
    if (pl.eventType === "DELETE"){ const pth = pl.old && pl.old.path; if (pth) store.delete(pth); }
    else if (pl.new && pl.new.path) store.set(pl.new.path, pl.new.data);
    notify();
  }).subscribe();
  // segurança extra: recarrega o que está na tela a cada 60 s, caso a conexão em tempo real caia
  setInterval(() => { for (const c of loadedColl.keys()) fetchColl(c).then(notify).catch(() => {}); }, 60000);

const VIDEO_EXT = {mp4:"video/mp4", m4v:"video/mp4", webm:"video/webm", mov:"video/quicktime", mkv:"video/x-matroska", avi:"video/x-msvideo", wmv:"video/x-ms-wmv", "3gp":"video/3gpp", ogv:"video/ogg", ogg:"video/ogg", mpeg:"video/mpeg", mpg:"video/mpeg"};
function videoType(f){ if (f.type && f.type.startsWith("video/")) return f.type; const ext = (f.name.split(".").pop() || "").toLowerCase(); return VIDEO_EXT[ext] || "video/mp4"; }
function pickFile(f, kind){
  if (!f) return;
  setStatus("");
  if (kind === "video"){
    const t = videoType(f), assetOk = S.assets && /^video\/(mp4|webm)$/.test(t);
    const max = assetOk ? VIDEO_ASSET_MAX : VIDEO_DB_MAX;
    if (f.size > max){ setStatus("O vídeo tem " + (f.size/1048576).toFixed(1) + " MB e o limite é " + (max/1048576) + " MB. Envie uma versão menor ou cole um link.", true); $("videoIn").value = ""; return; }
  }
  S.file = f; S.fileKind = kind;
  let media;
  if (kind === "image"){
    media = h("img",{alt:"Prévia da foto"});
    fileToDataUrl(f).then(d => { media.src = d; }).catch(() => media.onerror());
    media.onerror = () => { setStatus("Este formato de imagem não abre no navegador (ex.: HEIC). Salve como JPG ou PNG e tente de novo.", true); clearFile(); };
  } else {
    media = h("video",{controls:true, playsinline:true, preload:"metadata"});
    let triedData = false;
    try { media.src = URL.createObjectURL(f); } catch(e){}
    media.onerror = () => {
      if (!triedData && f.size < VIDEO_DB_MAX){ triedData = true; fileToDataUrl(f).then(d => { media.src = d; }); return; }
      setStatus("Aviso: este formato de vídeo pode não tocar em todos os navegadores. MP4 é o mais compatível.", true);
    };
  }
  $("preview").replaceChildren(h("div",{class:"preview"}, media, h("button",{class:"rm", onclick:clearFile, "aria-label":"Remover arquivo", text:"✕"})));
}
function clearFile(){ S.file = null; S.fileKind = null; $("preview").replaceChildren(); $("photoIn").value = ""; $("videoIn").value = ""; }
async function compress(file, maxSide, targetBytes){
  const img = await loadImg(file);
  let side = maxSide, q = 0.85, out;
  for (let tries = 0; tries < 8; tries++){
    const scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth*scale); c.height = Math.round(img.naturalHeight*scale);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    out = c.toDataURL("image/jpeg", q);
    if (out.length <= targetBytes) return out;
    if (q > 0.55) q -= 0.1; else side = Math.round(side*0.8);
  }
  throw new Error("too_big");
}
function dataUrlToBlob(d){
  const [head, b64] = d.split(",");
  const mime = (head.match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}
const fileToDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
const vcache = new Map();
async function loadDbVideo(p){
  if (vcache.has(p.id)) return vcache.get(p.id);
  const prom = (async () => {
    const snap = await S.db.collection("vchunks/" + p.id + "/c").limit(1000).get();
    const parts = snap.docs.map(d => d.data()).sort((a,b) => a.i - b.i).map(d => d.data).join("");
    const bin = atob(parts), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const mime = p.media.mime || "video/mp4";
    let blobUrl = null; try { blobUrl = URL.createObjectURL(new Blob([bytes], {type:mime})); } catch(e){}
    return {blobUrl, dataUrl:"data:" + mime + ";base64," + parts};
  })();
  vcache.set(p.id, prom);
  prom.catch(() => vcache.delete(p.id));
  return prom;
}

$("publish").onclick = async () => {
  const mode = S.mode;
  const text = pt.value.trim();
  let link = mode === "poll" ? "" : $("postLink").value.trim();
  if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;
  const id = uid();
  const post = {author:S.meId, text, createdAt:Date.now(), type: mode === "com" ? "comunicado" : mode === "poll" ? "poll" : "post"};
  if (mode === "poll"){
    if (!canManage()){ setStatus("Somente Gerente, Coordenador e Supervisor podem criar enquetes.", true); return; }
    const opts = [...$("pollOpts").querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
    if (!text){ setStatus("Escreva a pergunta da enquete.", true); pt.focus(); return; }
    if (opts.length < 2){ setStatus("A enquete precisa de pelo menos duas opções.", true); return; }
    const days = Number($("pollDur").value);
    post.poll = {options: opts.map((t,i) => ({id:"o" + i, text:t})), closesAt: days ? Date.now() + days*86400000 : null};
  } else if (mode === "com"){
    if (!canManage()){ setStatus("Somente Gerente, Coordenador e Supervisor podem publicar comunicados.", true); return; }
    const title = $("comTitle").value.trim();
    if (!title){ setStatus("Dê um título ao comunicado.", true); $("comTitle").focus(); return; }
    if (!text && !S.file && !link){ setStatus("Escreva o conteúdo do comunicado.", true); pt.focus(); return; }
    post.title = title; post.pinned = $("comPin").checked; post.requireAck = $("comAck").checked;
  } else if (!text && !S.file && !link){ setStatus("Escreva uma mensagem ou adicione uma foto, vídeo ou link.", true); pt.focus(); return; }
  if (link) post.link = link;
  const btn = $("publish"); btn.disabled = true; setStatus("Publicando…");
  try {
    if (S.file && S.fileKind === "image"){
      const isGif = S.file.type === "image/gif";
      let uploaded = false;
      if (S.assets){
        try {
          const blob = isGif && S.file.size < 15*1024*1024 ? S.file : dataUrlToBlob(await compress(S.file, 1800, 3_500_000));
          const r = await S.assets.upload(blob, {type: isGif && blob === S.file ? "image/gif" : "image/jpeg"});
          post.media = {kind:"image", assetId:r.id}; uploaded = true;
        } catch(e){ if (e && e.message === "too_big") throw e; console.warn("asset upload failed, using inline", e && (e.code || e.message)); }
      }
      if (!uploaded){
        let dataUrl = null;
        if (isGif && S.file.size < 140000) dataUrl = await fileToDataUrl(S.file);
        if (!dataUrl) dataUrl = await compress(S.file, 1400, 190_000);
        await S.db.doc("media/" + id).set({postId:id, dataUrl});
        post.media = {kind:"image", inline:true};
      }
    } else if (S.file && S.fileKind === "video"){
      const t = videoType(S.file);
      let up = false;
      if (S.assets && /^video\/(mp4|webm)$/.test(t)){
        setStatus("Enviando vídeo… isso pode levar um tempinho.");
        try { const r = await S.assets.upload(S.file, {type:t}); post.media = {kind:"video", assetId:r.id}; up = true; }
        catch(e){ if (S.file.size > VIDEO_DB_MAX) throw e; }
      }
      if (!up){
        const b64 = (await fileToDataUrl(S.file)).split(",")[1];
        const size = 190000, n = Math.ceil(b64.length / size);
        for (let i = 0; i < n; i++){
          setStatus("Enviando vídeo… " + Math.round(i * 100 / n) + "%");
          await S.db.doc("vchunks/" + id + "/c/" + String(i).padStart(4,"0")).set({i, data:b64.slice(i*size, (i+1)*size)});
        }
        post.media = {kind:"video", db:true, chunks:n, mime:t};
      }
    }
    await S.db.doc("posts/" + id).set(post);
    pt.value = ""; $("comTitle").value = ""; $("comAck").checked = false; $("comPin").checked = true;
    $("postLink").value = ""; $("linkWrap").hidden = true; $("toggleLink").setAttribute("aria-pressed","false");
    clearFile(); resetPoll(); setMode("post"); pt.classList.remove("tall");
    setStatus(mode === "com" ? "Comunicado publicado." : mode === "poll" ? "Enquete publicada." : "Publicado.");
    setTimeout(() => setStatus(""), 2500);
  } catch(e){
    const c = e && e.code;
    if (isDenied(e)) setStatus("Você não tem permissão para publicar neste mural.", true);
    else if (c === "quota_or_state" || c === "quota_exceeded") setStatus("O espaço do mural acabou. Peça ao administrador para remover publicações antigas.", true);
    else if (c === "too_large" || (e && e.message === "too_big")) setStatus("Arquivo grande demais. Tente uma imagem ou vídeo menor.", true);
    else if (e && e.type === "error" || (e && e.message === "image_decode")) setStatus("Não foi possível ler esta imagem. Salve como JPG ou PNG e tente de novo.", true);
    else setStatus("Não foi possível publicar (" + ((e && (e.code || e.message)) || "erro") + "). Tente de novo em instantes.", true);
  } finally { btn.disabled = false; }
};

async function deletePost(p){

  try { await S.db.doc("posts/" + p.id).delete(); }
  catch(e){ toast(isDenied(e) ? "Você não tem permissão para excluir esta publicação." : "Não foi possível excluir a publicação. Tente de novo."); return; }
  S.posts = S.posts.filter(x => x.id !== p.id); renderAll();
  toast("Publicação excluída.");
  const quiet = async path => { try { await S.db.doc(path).delete(); } catch(e){} };
  for (const c of S.comments.get(p.id) || []) await quiet("comments/" + c.id);
  for (const r of S.reactions.get(p.id) || []) await quiet("reactions/" + r.id);
  for (const r of S.votes.get(p.id) || []) await quiet("votes/" + r.id);
  for (const r of S.acks.get(p.id) || []) await quiet("acks/" + r.id);
  if (p.media && p.media.inline) await quiet("media/" + p.id);
  if (p.media && p.media.db) for (let i = 0; i < (p.media.chunks || 0); i++) await quiet("vchunks/" + p.id + "/c/" + String(i).padStart(4,"0"));

/* ---------- render pieces ---------- */
function mediaEl(p, onDouble){
  const m = p.media; if (!m) return null;
  const box = h("div",{class:"p-media"});
  const heart = h("div",{class:"heart", "aria-hidden":"true", text:"❤️"});
  const put = el => box.replaceChildren(el, heart);
  if (m.kind === "video" && m.assetId) put(h("video",{src:"/_blob/" + m.assetId, controls:true, playsinline:true, preload:"metadata"}));
  else if (m.kind === "video" && m.db){
    const load = () => {
      put(h("div",{class:"vload", text:"Carregando vídeo…"}));
      loadDbVideo(p).then(src => {
        const v = h("video",{controls:true, playsinline:true, preload:"metadata"});
        let usedData = !src.blobUrl;
        v.src = src.blobUrl || src.dataUrl;
        v.onerror = () => {
          if (!usedData){ usedData = true; v.src = src.dataUrl; return; }
          put(h("div",{class:"vload", text:"Este formato de vídeo não toca neste navegador. Peça para reenviar em MP4."}));
        };
        put(v);
      }).catch(() => put(h("div",{class:"vload"}, "Não foi possível carregar o vídeo.", h("br"), h("button",{class:"btn sm", onclick:load, text:"Tentar de novo"}))));
    };
    put(h("div",{class:"vload"}, "Vídeo", h("br"), h("button",{class:"btn sm", onclick:load, text:"▶ Carregar vídeo"})));
    if ("IntersectionObserver" in window){
      const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)){ io.disconnect(); load(); } }, {rootMargin:"200px"});
      io.observe(box);
    } else load();
  }
  else if (m.kind === "image" && m.assetId) put(h("img",{src:"/_blob/" + m.assetId, alt:"Foto da publicação", loading:"lazy"}));
  else if (m.kind === "image" && m.inline){
    const cached = S.media.get(p.id);
    if (cached) put(h("img",{src:cached, alt:"Foto da publicação"}));
    else {
      put(h("div",{class:"ph",text:"Carregando foto…"}));
      S.db.doc("media/" + p.id).get().then(s => {
        const d = s.exists && s.data();
        if (d && d.dataUrl){ S.media.set(p.id, d.dataUrl); put(h("img",{src:d.dataUrl, alt:"Foto da publicação"})); }
        else put(h("div",{class:"ph",text:"Foto indisponível"}));
      }).catch(() => put(h("div",{class:"ph",text:"Foto indisponível"})));
    }
  }
  if (m.kind === "image") box.addEventListener("dblclick", () => {
    heart.classList.remove("pop"); void heart.offsetWidth; heart.classList.add("pop"); onDouble();
  });
  return box;
}
function linkEl(url){
  let host = url; try { host = new URL(url).hostname.replace(/^www\./,""); } catch(e){}
  return h("a",{class:"p-link", href:url, target:"_blank", rel:"noopener noreferrer", onclick:e => openLink(e, url)}, h("small",{text:"🔗 " + host + " · toque para abrir"}), h("strong",{text:url.replace(/^https?:\/\//,"")}));
}
function pollEl(p){
  const votes = S.votes.get(p.id) || [];
  const mine = votes.find(v => v.user === S.meId);
  const closed = !!(p.poll.closesAt && Date.now() > p.poll.closesAt);
  const showRes = !!mine || closed || p.author === S.meId || canManage();
  const total = votes.length;
  const opts = p.poll.options.map(o => {
    const n = votes.filter(v => v.option === o.id).length;
    const pct = total ? Math.round(n * 100 / total) : 0;
    const isMine = mine && mine.option === o.id;
    const names = canManage() ? votes.filter(v => v.option === o.id).map(v => prof(v.user).name).join(", ") : "";
    return h("button",{class:"opt" + (isMine ? " mine" : ""), disabled: closed || !S.canWrite, "aria-pressed":String(!!isMine),
      title: names || null, onclick:() => vote(p, o.id)},
      showRes ? h("span",{class:"bar", style:"width:" + pct + "%"}) : null,
      h("span",{text:(isMine ? "✓ " : "") + o.text}),
      showRes ? h("span",{class:"pct", text:pct + "%"}) : null);
  });
  const foot = [plural(total,"voto","votos")];
  if (closed) foot.push("enquete encerrada");
  else if (p.poll.closesAt) foot.push("encerra " + until(p.poll.closesAt));
  if (!mine && !closed && !showRes) foot.push("vote para ver o resultado");
  if (mine && !closed) foot.push("clique na sua opção para desfazer");
  return h("div",{class:"poll"}, ...opts, h("div",{class:"poll-foot", text:foot.join(" · ")}));
}
function ackEl(p){
  if (!(typeOf(p) === "comunicado" && p.requireAck)) return null;
  const ids = approvedIds().filter(i => i !== p.author);
  const read = ids.filter(i => ackedBy(p.id, i)).length;
  if (canManage() || p.author === S.meId){
    return h("div",{class:"ackbar"}, h("span",{text:"✅ Leitura confirmada por " + read + " de " + ids.length}),
      h("button",{class:"linkbtn", style:"margin-left:auto", onclick:() => openReaders(p), text:"Ver quem leu"}));
  }
  const mine = (S.acks.get(p.id) || []).find(r => r.user === S.meId);
  return h("div",{class:"ackbar"}, mine ? h("span",{class:"ok", text:"✓ Você confirmou a leitura " + when(mine.at)}) :
    h("button",{class:"btn sm", onclick:() => ack(p.id), text:"Li e estou ciente"}));
}
function openPicker(postId, anchorWrap){
  closeMenus();
  const mine = (S.reactions.get(postId) || []).find(r => r.user === S.meId);
  const pk = h("div",{class:"picker", role:"group", "aria-label":"Escolha uma reação"},
    REACTIONS.map(R => h("button",{"aria-label":R.label, title:R.label, "aria-pressed":String(!!(mine && mine.kind===R.k)),
      onclick:(e) => { e.stopPropagation(); closeMenus(); setReaction(postId, R.k); }, text:R.e})));
  anchorWrap.append(pk);
  pk.querySelector("button").focus();
}

function buildCard(p){
  const card = h("article",{class:"card post"});
  const band = h("div",{class:"com-band"});
  const head = h("div",{class:"p-head"});
  const title = h("h2",{class:"p-title"});
  const text = h("div",{class:"p-text"});
  const poll = h("div");
  const media = mediaEl(p, () => { const mine = (S.reactions.get(p.id)||[]).find(r => r.user === S.meId); if (!mine) setReaction(p.id, "love"); });
  const link = p.link ? linkEl(p.link) : null;
  const ackBox = h("div");
  const stats = h("div",{class:"p-stats"});
  const actions = h("div",{class:"p-actions"});
  const reactBtn = h("button",{class:"act act-react"});
  let pressT = null, longFired = false, hoverT = null;
  reactBtn.addEventListener("click", () => {
    if (longFired){ longFired = false; return; }
    const mine = (S.reactions.get(p.id)||[]).find(r => r.user === S.meId);
    setReaction(p.id, mine ? null : "like");
  });
  reactBtn.addEventListener("contextmenu", e => { e.preventDefault(); openPicker(p.id, actions); });
  reactBtn.addEventListener("pointerdown", () => { longFired = false; pressT = setTimeout(() => { longFired = true; openPicker(p.id, actions); }, 450); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => reactBtn.addEventListener(ev, () => clearTimeout(pressT)));
  reactBtn.addEventListener("mouseenter", () => { hoverT = setTimeout(() => openPicker(p.id, actions), 550); });
  reactBtn.addEventListener("mouseleave", () => clearTimeout(hoverT));
  reactBtn.addEventListener("keydown", e => { if (e.key === "ArrowUp"){ e.preventDefault(); openPicker(p.id, actions); } });
  const pickSr = h("button",{class:"sr", onclick:() => openPicker(p.id, actions), text:"Escolher outra reação"});
  const ta = h("textarea",{rows:"1", maxlength:"1000", placeholder:"Escreva um comentário…", "aria-label":"Comentário"});
  const commentBtn = h("button",{class:"act", onclick:() => { S.expanded.add(p.id); renderAll(); ta.focus(); }}, h("span",{class:"i","aria-hidden":"true",text:"💬"}), "Comentar");
  actions.append(reactBtn, pickSr, commentBtn);
  const comments = h("div",{class:"p-comments"});
  const list = h("div",{style:"display:flex;flex-direction:column;gap:8px"});
  const send = h("button",{class:"send", text:"Publicar", disabled:true});
  ta.addEventListener("input", () => { send.disabled = !ta.value.trim(); });
  send.onclick = () => addComment(p.id, ta, send);
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); addComment(p.id, ta, send); } });
  const meSlot = h("span");
  const form = h("div",{class:"cform"}, meSlot, h("div",{class:"box"}, ta, send));
  comments.append(list, form);
  card.append(band, head, title, text, poll, ...(media ? [media] : []), ...(link ? [link] : []), ackBox, stats, actions, comments);
  return {card, band, head, title, text, poll, ackBox, stats, reactBtn, list, form, meSlot, key: cardKey(p)};
}
const cardKey = p => JSON.stringify(p.media || null) + (p.link || "") + typeOf(p);

function renderCard(p, c){
  const t = typeOf(p);
  const a = prof(p.author);
  const isCom = t === "comunicado";
  c.card.classList.toggle("com", isCom);
  c.band.hidden = !isCom && !p.pinned;
  c.band.replaceChildren(h("span",{text: isCom ? "📣 Comunicado" : "📌 Publicação fixada"}), isCom && p.pinned ? h("span",{class:"pin", text:"📌 Fixado"}) : null);
  if (!isCom && p.pinned) c.band.style.borderRadius = "13px 13px 0 0";
  const items = [];
  if (canManage()) items.push(h("button",{role:"menuitem", onclick:() => { closeMenus(); togglePin(p); }, text: p.pinned ? "Desafixar do topo" : "Fixar no topo"}));
  if (isCom && p.requireAck && (canManage() || p.author === S.meId)) items.push(h("button",{role:"menuitem", onclick:() => { closeMenus(); openReaders(p); }, text:"Ver quem leu"}));
  if (S.meId && (p.author === S.meId || canModerate())) items.push(h("button",{class:"danger", role:"menuitem", onclick:() => { closeMenus(); deletePost(p); }, text:"Excluir publicação"}));
  const dots = items.length ? h("div",{class:"menu-wrap"}, h("button",{class:"dots", "aria-label":"Opções da publicação", text:"⋯",
    onclick:(e) => { const wrap = e.currentTarget.parentNode; const had = wrap.querySelector(".menu"); closeMenus(); if (had) return; wrap.append(h("div",{class:"menu", role:"menu"}, items)); }})) : null;
  if (!c.head.querySelector(".menu")) c.head.replaceChildren(
    h("button",{class:"av-btn", "aria-label":"Perfil de " + a.name, onclick:() => openProfile(p.author)}, avatarEl(p.author)),
    h("div",{class:"grow"},
      h("button",{class:"who-btn", title:a.email || null, onclick:() => openProfile(p.author), text:a.name}),
      h("div",{class:"when", title:dtf.format(p.createdAt), text:[when(p.createdAt), a.cargo, a.setor].filter(Boolean).join(" · ")})),
    dots);
  c.title.textContent = p.title || ""; c.title.hidden = !p.title;
  if (c.text.dataset.src !== (p.text || "")){ c.text.replaceChildren(...linkify(p.text)); c.text.dataset.src = p.text || ""; }
  c.text.hidden = !p.text;
  c.text.classList.toggle("big", t === "post" && !!p.text && p.text.length <= 90 && !p.media && !p.link);
  c.text.style.fontWeight = t === "poll" ? "700" : "";
  c.poll.replaceChildren(t === "poll" && p.poll ? pollEl(p) : "");
  c.ackBox.replaceChildren(ackEl(p) || "");

  const rs = S.reactions.get(p.id) || [];
  const cs = S.comments.get(p.id) || [];
  const mine = rs.find(r => r.user === S.meId);
  const counts = {}; rs.forEach(r => counts[r.kind] = (counts[r.kind]||0) + 1);
  const top = Object.keys(counts).filter(k => RX[k]).sort((x,y) => counts[y]-counts[x]).slice(0,3);
  let who = "";
  if (rs.length){
    const others = rs.filter(r => r.user !== S.meId);
    if (mine) who = others.length ? "Você e " + plural(others.length, "outra pessoa", "outras pessoas") : "Você";
    else who = others.length === 1 ? prof(others[0].user).name : firstName(others[0].user) + " e " + plural(others.length-1, "outra pessoa", "outras pessoas");
  }
  c.stats.replaceChildren(
    rs.length ? h("span",{class:"emo", "aria-hidden":"true"}, top.map(k => h("span",{text:RX[k].e}))) : null,
    rs.length ? h("span",{title:rs.map(r => (RX[r.kind]||{}).e + " " + prof(r.user).name).join("\n"), text:who}) : null,
    h("span",{class:"grow"}),
    cs.length ? h("button",{onclick:() => { S.expanded.has(p.id) ? S.expanded.delete(p.id) : S.expanded.add(p.id); renderAll(); }, text:plural(cs.length,"comentário","comentários")}) : null);
  c.stats.hidden = !rs.length && !cs.length;

  const R = mine && RX[mine.kind];
  c.reactBtn.className = "act act-react" + (R ? " on" : "");
  c.reactBtn.disabled = !S.canWrite;
  c.reactBtn.setAttribute("aria-pressed", String(!!R));
  c.reactBtn.setAttribute("aria-label", R ? "Remover reação " + R.label : "Curtir (segure ou use seta para cima para outras reações)");
  c.reactBtn.replaceChildren(h("span",{class:"i","aria-hidden":"true",text:R ? R.e : "👍"}), R ? R.label : "Curtir");

  const open = S.expanded.has(p.id);
  const shown = open ? cs : cs.slice(-2);
  const nodes = [];
  if (cs.length > 2 && !open) nodes.push(h("button",{class:"more", onclick:() => { S.expanded.add(p.id); renderAll(); }, text:"Ver todos os " + cs.length + " comentários"}));
  for (const cm of shown){
    const w = prof(cm.author);
    const canDelC = S.meId && (cm.author === S.meId || canModerate());
    nodes.push(h("div",{class:"cmt"},
      h("button",{class:"av-btn", "aria-label":"Perfil de " + w.name, onclick:() => openProfile(cm.author)}, avatarEl(cm.author,"sm")),
      h("div",{style:"min-width:0"},
        h("div",{class:"bubble"}, h("div",{class:"who",text:w.name}), h("div",{class:"txt"}, linkify(cm.text))),
        h("div",{class:"meta"}, h("span",{title:dtf.format(cm.createdAt), text:when(cm.createdAt)}),
          canDelC ? h("button",{onclick:() => deleteComment(cm), text:"Excluir"}) : null))));
  }
  c.list.replaceChildren(...nodes);
  c.list.hidden = !nodes.length;
  c.form.hidden = !S.canWrite;
  c.meSlot.replaceChildren(avatarEl(S.meId,"sm"));
}

function renderStories(){
  const latest = new Map();
  for (const p of S.posts) if (p.author && p.media && p.media.kind === "image" && !latest.has(p.author)) latest.set(p.author, p.createdAt);
  const items = [];
  if (S.canWrite && S.meId){
    items.push(h("button",{class:"story", onclick:() => { setFilter("all"); setMode("post"); $("pickPhoto").click(); }},
      h("span",{class:"ring seen"}, h("span",{class:"plus", text:"+"})), h("span",{class:"nm",text:"Nova foto"})));
  }
  for (const [id, t] of latest){
    const p = prof(id);
    const fresh = Date.now() - t < 86400000;
    const on = S.author === id && S.filter === "image";
    const img = p.avatar ? h("img",{src:p.avatar, alt:""}) : h("span",{class:"plus", "aria-hidden":"true", text:(p.name[0]||"?").toUpperCase()});
    items.push(h("button",{class:"story", "aria-pressed":String(on), title:"Ver fotos de " + p.name,
      onclick:() => on ? setFilter("all") : setFilter("image", id)},
      h("span",{class:"ring" + (fresh ? "" : " seen")}, img), h("span",{class:"nm", text:id === S.meId ? "Você" : firstName(id)})));
  }
  $("stories").replaceChildren(...items);
  $("stories").hidden = !items.length;
}
function renderRank(){
  const since = Date.now() - 30*86400000, cnt = new Map();
  for (const p of S.posts) if (p.createdAt >= since && p.author) cnt.set(p.author, (cnt.get(p.author)||0) + 1);
  const top = [...cnt].sort((a,b) => b[1]-a[1]).slice(0,5);
  $("rank").replaceChildren(...(top.length ? top.map(([id,n]) =>
    h("button",{onclick:() => openProfile(id)}, avatarEl(id,"sm"), h("span",{class:"nm", text:prof(id).name}), h("span",{class:"cnt", text:plural(n,"post","posts")})))
    : [h("p",{text:"Ninguém publicou nos últimos 30 dias."})]));
}
function renderMembers(){
  const list = [...S.members.values()].filter(m => (apr(m.userId) || {}).status === "aprovado")
    .sort((a,b) => (a.displayName||"").localeCompare(b.displayName||"", "pt-BR"));
  $("membersTitle").textContent = "Membros (" + list.length + ")";
  $("members").replaceChildren(...(list.length ? list.slice(0,12).map(m => {
    const p = prof(m.userId);
    return h("button",{onclick:() => openProfile(m.userId), title:p.email}, avatarEl(m.userId,"sm"),
      h("span",{style:"min-width:0"}, h("div",{class:"nm",text:p.name}), h("div",{class:"em",text:[p.cargo, p.setor].filter(Boolean).join(" · ") || p.email})));
  }) : [h("p",{text:"Ninguém entrou ainda."})]));
}
function renderChip(){
  const chip = $("filterChip");
  const labels = {image:"Mostrando só fotos", video:"Mostrando só vídeos", link:"Mostrando só links", mine:"Mostrando suas publicações", com:"Mostrando comunicados", poll:"Mostrando enquetes"};
  let label = S.author ? (S.filter === "image" ? "Fotos de " : "Publicações de ") + prof(S.author).name : labels[S.filter];
  if (S.setor) label = (label ? label + ", " : "Mostrando ") + "setor " + S.setor;
  if (S.q) label = (label ? label + ", " : "") + "busca: “" + S.q + "”";
  chip.hidden = !label;
  if (label) chip.replaceChildren(h("span",{text:label}), h("button",{class:"btn ghost sm", onclick:() => { $("search").value = ""; S.q = ""; S.setor = null; setFilter("all"); }, text:"Limpar"}));
}
function renderMe(){
  $("meAvatar").replaceChildren(avatarEl(S.meId,"xs"));
  $("meName").textContent = S.meId ? firstName(S.meId) : "";
  $("cAvatar").replaceChildren(avatarEl(S.meId));
  if (S.mode === "post") pt.placeholder = placeholderFor();
  $("modeCom").hidden = !canManage(); $("modePoll").hidden = !canManage();
  document.querySelector(".modes").hidden = !canManage();
  if (S.mode !== "post" && !canManage()) setMode("post");
  $("composer").hidden = !S.canWrite;
}

function renderAll(){
  renderMe();
  if (!S.db) return;
  renderStories(); renderRank(); renderMembers(); renderChip(); updateAdminBadge(); materializeInvites();
  const act = document.activeElement;
  if (!$("admin").hidden && !(act && $("adminCard").contains(act) && act.matches("input,select"))) renderAdmin();
  checkLock();
  renderSetorBar();
  if (S.detailId && !$("modal").hidden){
    const dp = S.posts.find(x => x.id === S.detailId);
    if (!dp) closeModal();
    else if (S.detailCard && S.detailCard.key === cardKey(dp)) renderCard(dp, S.detailCard);
  }
  if (!S.ready.posts) return;
  $("feedView").hidden = S.view !== "feed"; $("profileView").hidden = S.view !== "profile";
  if (S.view === "profile"){ renderProfile(); return; }
  const feed = $("feed");
  const posts = visiblePosts();
  if (!posts.length){
    const filtered = S.filter !== "all" || S.author || S.q || S.setor;
    feed.replaceChildren(h("div",{class:"card empty"},
      h("strong",{text: filtered ? "Nada por aqui" : "O mural está vazio"}),
      filtered ? "Nenhuma publicação combina com este filtro." : (S.canWrite ? "Escreva a primeira publicação no campo acima." : "Ainda não há publicações.")));
    return;
  }
  syncCards(feed, posts, S.cards);
}
function syncCards(container, posts, cache){
  const act = document.activeElement;
  const nodes = [], alive = new Set(S.posts.map(p => p.id));
  for (const p of posts){
    let c = cache.get(p.id);
    if (!c || c.key !== cardKey(p)){ c = buildCard(p); cache.set(p.id, c); }
    renderCard(p, c);
    nodes.push(c.card);
  }
  for (const id of [...cache.keys()]) if (!alive.has(id)) cache.delete(id);
  const current = [...container.children];
  if (current.length !== nodes.length || current.some((n,i) => n !== nodes[i])){
    container.replaceChildren(...nodes);
    if (act && container.contains(act)) act.focus();
  }
}
function renderSetorBar(){
  const bar = $("setorBar");
  const used = new Set([...S.members.values()].map(m => m.setor).filter(Boolean));
  const list = SETORES.concat([...used].filter(x => !SETORES.includes(x)));
  const chip = (val, txt) => h("button",{class:"chip", "aria-pressed":String(S.setor === val), onclick:() => { S.setor = val; S.view = "feed"; renderAll(); }, text:txt});
  bar.replaceChildren(chip(null, "Todos os setores"), ...list.map(x => chip(x, x.replace(/^CSC - /, ""))));
}
setInterval(() => { if (S.posts.length) renderAll(); }, 60000);
boot().catch(() => showFatal("Algo deu errado ao abrir o mural. Recarregue a página."));
})();
</script>
